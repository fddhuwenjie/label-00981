services:
  # ============================================
  # Tres.js Vue3 前端服务
  # ============================================
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: tres-showcase-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - tres-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tres-network:
    driver: bridge
    name: tres-showcase-network


